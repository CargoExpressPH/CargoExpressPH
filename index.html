    <!-- ====== Theme & Colors ====== -->
    <meta name="theme-color" content="#16A34A" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#16A34A" />
    <meta name="msapplication-navbutton-color" content="#16A34A" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('cargoexpress_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = storedTheme === 'dark' || storedTheme === 'light'
            ? storedTheme
            : prefersDark ? 'dark' : 'light';

          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <!-- The generated public HTML is readable without JavaScript. While the
         app starts, show its loading state instead of flashing that markup. -->
    <style>
      .seo-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 960px;
        margin: auto;
        padding: clamp(24px, 7vw, 72px);

        flex-direction: column;
        justify-content: center;
        gap: 18px;
        font: 16px/1.55 system-ui, sans-serif;
        color: #182b3d;
      }
      .seo-fallback > a { color: #157a47; font-size: 1.3rem; font-weight: 750; text-decoration: none; }
      .seo-fallback h1 { max-width: 680px; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.12; }
      .seo-fallback p { max-width: 640px; font-size: clamp(1rem, 3vw, 1.2rem); }
      .seo-fallback nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
      .seo-fallback nav a {
        padding: 9px 14px;
        border: 1px solid #c9e5d5;
        border-radius: 999px;
        color: #11663b;
        text-decoration: none;
      }
      [data-theme="dark"] .seo-fallback { color: #edf7f1; }
      [data-theme="dark"] .seo-fallback > a,
      [data-theme="dark"] .seo-fallback nav a { color: #a1e8bd; }
      [data-theme="dark"] .seo-fallback nav a { border-color: #456b55; }
      html.app-booting #root:has(> .seo-fallback) {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f5faf7;
        font: 700 1.15rem system-ui, sans-serif;
        color: #11663b;
      }
      html.app-booting #root > .seo-fallback { display: none; }
      html.app-booting #root:has(> .seo-fallback)::before { content: "CargoExpress PH"; }
      html.app-booting #root:has(> .seo-fallback)::after {
        content: "";
        width: 30px;
        height: 30px;
        border: 3px solid #c9e5d5;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: seo-loading-spin 0.8s linear infinite;
      }
      [data-theme="dark"].app-booting #root:has(> .seo-fallback) { background: #0f172a; color: #a1e8bd; }
      @keyframes seo-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        html.app-booting #root:has(> .seo-fallback)::after { animation: none; }
      }
    </style>
    <script>
      document.documentElement.classList.add('app-booting');
      // If the bundle cannot load, restore the usable public page instead of
      // leaving visitors on a loading screen indefinitely.
      setTimeout(function () {
        if (document.querySelector('#root > .seo-fallback')) {
          document.documentElement.classList.remove('app-booting');
        }
      }, 8000);
    </script>

    <!-- ====== Service Worker Registration ====== -->
    <script>
      if ('serviceWorker' in navigator) {
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/',
            });

            if (!isDev) {
              // Check for updates periodically (every 1 minute)...
              setInterval(() => {
                registration.update();
              }, 1 * 60 * 1000);

              // ...and the moment the installed app is actually reopened or
              // refocused, since that is exactly when a returning customer or
              // admin most wants "did I get the latest version" answered —
              // not up to an hour later. A backgrounded tab/app resuming is
              // the case the hourly interval alone can miss for a long time.
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') registration.update();
              });

              // sw.js calls self.skipWaiting() on install and
              // self.clients.claim() on activate, so a new worker takes over
              // every open tab the instant it activates — no waiting for tabs
              // to close. This script's job stops at making sure that check
              // happens often; what to DO once a new worker is in control
              // (tell the customer/admin and let them choose when to reload,
              // rather than reloading out from under them) is handled by
              // useServiceWorkerUpdate + <UpdateAvailableBanner> once React
              // has mounted, not here — see src/hooks/useServiceWorkerUpdate.js.
            }
          } catch (error) {
            // SW registration failed — app continues working without offline support
          }
        });
      }
    </script>
