<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-visual" />

    <!-- ====== SEO & App Meta ====== -->
    <title>CargoExpress PH — Cargo Delivery Booking &amp; Tracking</title>
    <meta name="description" content="CargoExpress PH - Web-Based Cargo Delivery Booking and Tracking System. Track shipments, manage deliveries, and streamline your logistics operations across the Philippines." />
    <meta name="keywords" content="cargo, delivery, booking, tracking, logistics, Philippines, shipping, freight, CargoExpress" />
    <meta name="author" content="CargoExpress PH" />
    <meta name="application-name" content="CargoExpress PH" />

    <!-- ====== Theme & Colors ====== -->
    <meta name="theme-color" content="#16A34A" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#16A34A" />
    <meta name="msapplication-navbutton-color" content="#16A34A" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('cargoexpress_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = storedTheme === 'dark' || storedTheme === 'light'
            ? storedTheme
            : prefersDark ? 'dark' : 'light';

          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <!-- The first meaningful paint must not wait for React or the main CSS
         bundle. This small, dependency-free shell intentionally matches the
         React SplashScreen so startup is one continuous visual state. -->
    <link rel="preload" as="image" href="/images/logo-nav.png" fetchpriority="high" />
    <style id="boot-splash-styles">
      html { background: #0f172a; }
      body { margin: 0; }
      .app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        overflow: hidden;
        color: #f8fafc;
        background:
          radial-gradient(circle at 50% 38%, rgba(22, 163, 74, 0.16), transparent 32%),
          linear-gradient(145deg, #0b1424 0%, #0f172a 54%, #111f35 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      .app-boot-splash::before,
      .app-boot-splash::after {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        content: "";
        filter: blur(80px);
        opacity: 0.12;
        pointer-events: none;
      }
      .app-boot-splash::before { top: -170px; right: -110px; background: #22c55e; }
      .app-boot-splash::after { bottom: -190px; left: -130px; background: #2d5a8a; }
      .app-boot-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(100%, 360px);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .app-boot-splash__mark {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        margin-bottom: 20px;
        border: 1px solid rgba(52, 211, 153, 0.24);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28), 0 0 36px rgba(22, 163, 74, 0.12);
        animation: boot-mark-in 480ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .app-boot-splash__mark img {
        display: block;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
      }
      .app-boot-splash__brand {
        margin: 0;
        color: #fff;
        font-size: clamp(1.25rem, 5vw, 1.5rem);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .app-boot-splash__brand span { color: #34d399; }
      .app-boot-splash__bar {
        position: relative;
        width: min(220px, 68vw);
        height: 3px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
      }
      .app-boot-splash__bar::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #34d399 38%, #86efac 70%, transparent);
        content: "";
        animation: boot-progress 1.35s ease-in-out infinite;
      }
      .app-boot-splash__status {
        margin: 14px 0 0;
        color: #cbd5e1;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.5;
      }
      .app-boot-splash--leaving { opacity: 0; visibility: hidden; }
      @keyframes boot-mark-in {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes boot-progress {
        from { transform: translateX(-125%); }
        to { transform: translateX(345%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash,
        .app-boot-splash__mark { transition: none; animation: none; }
        .app-boot-splash__bar::after { animation: none; left: 27.5%; opacity: 0.85; }
      }
    </style>

    <!-- ====== PWA Manifest ====== -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <!-- ====== Favicon & Icons ====== -->
    <!-- favicon.ico first: browsers request /favicon.ico implicitly whether or
         not it is declared, and a 404 there is what leaves a stale or default
         icon in the tab. Multi-resolution (16/32/48) so the browser picks its
         own size rather than rescaling one. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

    <!-- ====== Apple PWA Meta ====== -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CargoExpress PH" />

    <!-- ====== Open Graph Meta ====== -->

    <meta name="twitter:title" content="CargoExpress PH — Cargo Delivery Booking & Tracking" />
    <meta name="twitter:description" content="Web-Based Cargo Delivery Booking and Tracking System for the Philippines." />
    <meta name="twitter:image" content="/images/logo.png" />

    <!-- ====== Preconnect for Performance ====== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div

      <div class="app-boot-splash__content">

        <p class="app-boot-splash__brand" aria-hidden="true">CARGOEXPRESS <span>PH</span></p>
        <div class="app-boot-splash__bar" aria-hidden="true"></div>
        <p class="app-boot-splash__status">Getting CargoExpress PH ready…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ====== Service Worker Registration ====== -->
    <script>
      if ('serviceWorker' in navigator) {
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/',
            });

            if (!isDev) {
              // Check for updates periodically (every 60 minutes)...
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000);

              // ...and the moment the installed app is actually reopened or
              // refocused, since that is exactly when a returning customer or
              // admin most wants "did I get the latest version" answered —
              // not up to an hour later. A backgrounded tab/app resuming is
              // the case the hourly interval alone can miss for a long time.
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') registration.update();
              });

              // sw.js calls self.skipWaiting() on install and
              // self.clients.claim() on activate, so a new worker takes over
              // every open tab the instant it activates — no waiting for tabs
              // to close. This script's job stops at making sure that check
              // happens often; what to DO once a new worker is in control
              // (tell the customer/admin and let them choose when to reload,
              // rather than reloading out from under them) is handled by
              // useServiceWorkerUpdate + <UpdateAvailableBanner> once React
              // has mounted, not here — see src/hooks/useServiceWorkerUpdate.js.
            }
          } catch (error) {
            // SW registration failed — app continues working without offline support
          }
        });
      }
    </script>
  </body>
</html>
